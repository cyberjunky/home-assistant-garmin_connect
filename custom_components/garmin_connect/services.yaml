set_active_gear:
  name: Set active gear
  description: Set a gear item as the default for a specific activity type.
  fields:
    gear_uuid:
      name: Gear UUID
      description: UUID of the gear. Use either gear_uuid or entity_id.
      example: "abc123-def456"
      selector:
        text:
    entity_id:
      name: Gear entity
      description: Entity ID of the gear sensor. Use either entity_id or gear_uuid.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    activity_type:
      name: Activity type
      description: The activity type to assign the gear to.
      required: true
      selector:
        select:
          options:
            - running
            - cycling
            - hiking
            - walking
            - swimming
            - other
    setting:
      name: Setting
      description: How to apply the gear assignment.
      selector:
        select:
          options:
            - "set this as default, unset others"
            - "set as default"
            - "unset default"

add_body_composition:
  name: Add body composition
  description: Upload a body composition measurement to Garmin Connect.
  fields:
    entity_id:
      name: Garmin Connect weight entity
      description: Optional Garmin Connect weight sensor whose account should receive the measurement.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
          device_class: weight
    weight:
      name: Weight (kg)
      description: Body weight in kilograms.
      required: true
      selector:
        number:
          min: 20
          max: 300
          step: 0.1
          unit_of_measurement: kg
    timestamp:
      name: Timestamp
      description: "Measurement time (ISO 8601, e.g. 2024-01-15T08:30:00). Defaults to now."
      example: "2024-01-15T08:30:00"
      selector:
        text:
    bmi:
      name: BMI
      selector:
        number:
          min: 10
          max: 60
          step: 0.1
    percent_fat:
      name: Body fat (%)
      selector:
        number:
          min: 1
          max: 70
          step: 0.1
          unit_of_measurement: "%"
    percent_hydration:
      name: Body hydration (%)
      selector:
        number:
          min: 1
          max: 80
          step: 0.1
          unit_of_measurement: "%"
    visceral_fat_mass:
      name: Visceral fat mass (kg)
      selector:
        number:
          min: 0
          max: 50
          step: 0.1
          unit_of_measurement: kg
    bone_mass:
      name: Bone mass (kg)
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: kg
    muscle_mass:
      name: Muscle mass (kg)
      selector:
        number:
          min: 0
          max: 150
          step: 0.1
          unit_of_measurement: kg
    basal_met:
      name: Basal metabolic rate (kcal)
      selector:
        number:
          min: 500
          max: 5000
          step: 1
          unit_of_measurement: kcal
    active_met:
      name: Active metabolic rate (kcal)
      selector:
        number:
          min: 500
          max: 10000
          step: 1
          unit_of_measurement: kcal
    physique_rating:
      name: Physique rating
      selector:
        number:
          min: 1
          max: 9
          step: 1
    metabolic_age:
      name: Metabolic age
      selector:
        number:
          min: 10
          max: 100
          step: 1
    visceral_fat_rating:
      name: Visceral fat rating
      selector:
        number:
          min: 1
          max: 59
          step: 1

add_blood_pressure:
  name: Add blood pressure
  description: Upload a blood pressure reading to Garmin Connect.
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account should receive the measurement.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    systolic:
      name: Systolic (mmHg)
      required: true
      selector:
        number:
          min: 70
          max: 260
          step: 1
          unit_of_measurement: mmHg
    diastolic:
      name: Diastolic (mmHg)
      required: true
      selector:
        number:
          min: 40
          max: 150
          step: 1
          unit_of_measurement: mmHg
    pulse:
      name: Pulse (bpm)
      description: Optional. Garmin Connect's own app accepts a reading without a heart rate.
      required: false
      selector:
        number:
          min: 20
          max: 250
          step: 1
          unit_of_measurement: bpm
    timestamp:
      name: Timestamp
      description: "Measurement time (ISO 8601). Defaults to now."
      example: "2024-01-15T08:30:00"
      selector:
        text:
    notes:
      name: Notes
      selector:
        text:

create_activity:
  name: Create activity
  description: Create a manual activity in Garmin Connect.
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account should receive the activity.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    activity_name:
      name: Activity name
      required: true
      selector:
        text:
    activity_type:
      name: Activity type
      required: true
      selector:
        select:
          options:
            - running
            - cycling
            - walking
            - hiking
            - swimming
            - fitness_equipment
            - other
    start_datetime:
      name: Start time
      description: "Start time (ISO 8601). Defaults to now."
      example: "2024-01-15T08:30:00"
      selector:
        text:
    duration_min:
      name: Duration (minutes)
      required: true
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
    distance_km:
      name: Distance (km)
      selector:
        number:
          min: 0
          max: 1000
          step: 0.01
          unit_of_measurement: km
    time_zone:
      name: Time zone
      description: "IANA time zone (e.g. Europe/Amsterdam). Defaults to HA time zone."
      example: "Europe/Amsterdam"
      selector:
        text:

upload_activity:
  name: Upload activity
  description: Upload a FIT/GPX/TCX activity file to Garmin Connect.
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account should receive the upload.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    file_path:
      name: File path
      description: FIT, GPX or TCX file on the HA host, absolute or relative to the config directory. Paths outside the config directory must be in allowlist_external_dirs.
      required: true
      example: "/config/activities/run.fit"
      selector:
        text:

download_activity:
  name: Download activity
  description: Download an activity file from Garmin Connect and save it on the HA host.
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account owns the activity.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    activity_id:
      name: Activity ID
      description: Garmin activity ID (see last_activity sensor attributes).
      required: true
      example: 23545484677
      selector:
        number:
          mode: box
          min: 0
          max: 999999999999
    file_format:
      name: File format
      description: File format to download. "fit" extracts the FIT file from the original recording, "original" keeps the raw zip.
      default: fit
      selector:
        select:
          options:
            - fit
            - original
            - tcx
            - gpx
            - kml
            - csv
    file_path:
      name: File path
      description: Target file or directory. Must be in allowlist_external_dirs. Defaults to <config>/garmin_activities/activity_<id>.<format>.
      example: "/config/garmin_activities/run.fit"
      selector:
        text:

add_hydration:
  name: Add hydration
  description: Log a hydration intake (or deduction) to Garmin Connect.
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account should receive the measurement.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    value_in_ml:
      name: Amount (mL)
      description: Hydration amount in millilitres. Use a negative value to subtract from today's intake.
      required: true
      selector:
        number:
          min: -5000
          max: 5000
          step: 1
          unit_of_measurement: mL
    timestamp:
      name: Timestamp
      description: "Measurement time (ISO 8601). Defaults to now."
      example: "2024-01-15T08:30:00"
      selector:
        text:

add_gear_to_activity:
  name: Add gear to activity
  description: Link a gear item to an existing Garmin Connect activity.
  fields:
    activity_id:
      name: Activity ID
      required: true
      selector:
        number:
          min: 1
          step: 1
    gear_uuid:
      name: Gear UUID
      description: UUID of the gear. Use either gear_uuid or entity_id.
      example: "abc123-def456"
      selector:
        text:
    entity_id:
      name: Gear entity
      description: Entity ID of the gear sensor. Use either entity_id or gear_uuid.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
add_nutrition_log:
  name: Add nutrition log
  description: >
    Log a Quick Add nutrition entry to Garmin Connect.
    Requires a Connect+ subscription and initial nutrition setup in the Garmin Connect app.
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account should receive the entry.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    calories:
      name: Calories (kcal)
      description: Calories to log.
      required: true
      selector:
        number:
          min: 0
          max: 10000
          step: 1
          unit_of_measurement: kcal
    carbs:
      name: Carbohydrates (g)
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: g
    protein:
      name: Protein (g)
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: g
    fat:
      name: Fat (g)
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: g
    name:
      name: Label
      description: Name for the log entry (defaults to "Quick Add").
      example: "Lunch"
      selector:
        text:
    timestamp:
      name: Timestamp
      description: "Log time (ISO 8601). Defaults to now."
      example: "2024-01-15T12:30:00"
      selector:
        text:

create_workout:
  name: Create workout
  description: Create a workout in the Garmin Connect library, optionally scheduling it on a date. Returns workout_id (and schedule_id).
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account gets the workout.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    workout:
      name: Workout
      description: Garmin workout JSON (workoutName, sportType, workoutSegments), as an object or JSON string.
      required: true
      example: >-
        {"workoutName": "Easy 30 min", "sportType": {"sportTypeId": 1, "sportTypeKey": "running"},
        "workoutSegments": [{"segmentOrder": 1, "sportType": {"sportTypeId": 1, "sportTypeKey": "running"},
        "workoutSteps": [{"type": "ExecutableStepDTO", "stepOrder": 1,
        "stepType": {"stepTypeId": 3, "stepTypeKey": "interval"},
        "endCondition": {"conditionTypeId": 2, "conditionTypeKey": "time"}, "endConditionValue": 1800,
        "targetType": {"workoutTargetTypeId": 1, "workoutTargetTypeKey": "no.target"}}]}]}
      selector:
        object:
    date:
      name: Date
      description: Optional date to put the workout on the training calendar.
      example: "2026-10-16"
      selector:
        date:

update_workout:
  name: Update workout
  description: Replace an existing workout in place. Its ID and calendar schedules are kept.
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account owns the workout.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    workout_id:
      name: Workout ID
      description: ID of the workout to replace.
      required: true
      example: 1234567890
      selector:
        number:
          mode: box
          min: 1
          max: 999999999999
    workout:
      name: Workout
      description: Complete Garmin workout JSON, as an object or JSON string.
      required: true
      selector:
        object:

delete_workout:
  name: Delete workout
  description: Delete a workout from the Garmin Connect library, including its calendar entries.
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account owns the workout.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    workout_id:
      name: Workout ID
      description: ID of the workout to delete.
      required: true
      example: 1234567890
      selector:
        number:
          mode: box
          min: 1
          max: 999999999999

schedule_workout:
  name: Schedule workout
  description: Put a library workout on the Garmin training calendar. Returns schedule_id.
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account owns the workout.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    workout_id:
      name: Workout ID
      description: ID of the workout to schedule.
      required: true
      example: 1234567890
      selector:
        number:
          mode: box
          min: 1
          max: 999999999999
    date:
      name: Date
      description: Calendar date for the workout.
      required: true
      example: "2026-10-16"
      selector:
        date:

unschedule_workout:
  name: Unschedule workout
  description: Remove a workout from the Garmin training calendar without deleting it.
  fields:
    entity_id:
      name: Garmin Connect entity
      description: Optional Garmin Connect entity whose account owns the schedule.
      selector:
        entity:
          integration: garmin_connect
          domain: sensor
    schedule_id:
      name: Schedule ID
      description: Calendar entry ID (schedule_id from schedule_workout, or the id of a scheduled workout).
      required: true
      example: 987654321
      selector:
        number:
          mode: box
          min: 1
          max: 999999999999
